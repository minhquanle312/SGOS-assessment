services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgos_assessment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sgos} -d ${POSTGRES_DB:-sgos_assessment}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgos}:${POSTGRES_PASSWORD:-sgos_dev_password}@db:5432/${POSTGRES_DB:-sgos_assessment}?schema=public
    # runs once, applies pending migrations, exits; app waits for this to
    # finish successfully before it starts (see app's depends_on below).
    # kept as a separate service (built off the `builder` stage, which
    # already has the prisma CLI) instead of baking migrate into the
    # runner image, so the runtime image stays lean.
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgos}:${POSTGRES_PASSWORD:-sgos_dev_password}@db:5432/${POSTGRES_DB:-sgos_assessment}?schema=public
      AI_API_BASE_URL: ${AI_API_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      # Next.js standalone server binds to $HOSTNAME if set; Docker auto-sets
      # HOSTNAME to the container id, which makes the server listen only on
      # the container's own interface IP, not on 127.0.0.1 — breaking any
      # healthcheck run from inside the same container. Force 0.0.0.0.
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgos}:${POSTGRES_PASSWORD:-sgos_dev_password}@db:5432/${POSTGRES_DB:-sgos_assessment}?schema=public
    # `builder` stage already has node_modules (with prisma CLI) and
    # prisma/schema.prisma baked into the image, no bind mount needed
    # (bind mount path is relative to compose file location, breaks on
    # some hosts like Coolify where checkout path differs).
    command: sh -c "npx prisma studio --port 5555 --hostname 0.0.0.0 --schema prisma/schema.prisma"
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5555 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgos_assessment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sgos} -d ${POSTGRES_DB:-sgos_assessment}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgos}:${POSTGRES_PASSWORD:-sgos_dev_password}@db:5432/${POSTGRES_DB:-sgos_assessment}?schema=public
      AI_API_BASE_URL: ${AI_API_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
    ports:
      - "3000:3000"

  studio:
    image: node:26-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgos}:${POSTGRES_PASSWORD:-sgos_dev_password}@db:5432/${POSTGRES_DB:-sgos_assessment}?schema=public
    # Prisma 7.10.0's `studio` dropped --hostname and only binds to
    # 127.0.0.1 inside a container (unreachable via port publish), and a
    # socat TCP proxy in front of it corrupts the /bff POST responses
    # Studio relies on. 6.12.0 (matches this project's own prisma version)
    # supports --hostname 0.0.0.0 directly, no proxy needed.
    command: sh -c "npx --yes prisma@6.12.0 studio --port 5555 --hostname 0.0.0.0 --schema prisma/schema.prisma"
    ports:
      - "5555:5555"

volumes:
  pgdata:

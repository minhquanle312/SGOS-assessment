services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgos_assessment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgos} -d ${POSTGRES_DB:-sgos_assessment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgos}:${POSTGRES_PASSWORD:-sgos_dev_password}@db:5432/${POSTGRES_DB:-sgos_assessment}?schema=public
      AI_API_BASE_URL: ${AI_API_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
    ports:
      - "3000:3000"

volumes:
  pgdata:
